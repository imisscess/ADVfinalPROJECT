<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.65" stop-color="#eaf3ff"/>
      <stop offset="1" stop-color="#efe9ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="900" height="700" rx="64" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="120" y="130" width="660" height="440" rx="56" fill="#ffffff"/>
    <rect x="170" y="190" width="260" height="26" rx="13" fill="#e2e8f0"/>
    <rect x="170" y="232" width="380" height="18" rx="9" fill="#e2e8f0"/>
    <g transform="translate(210 290)">
      <rect x="0" y="0" width="520" height="280" rx="60" fill="#f1f5f9"/>
      <g transform="translate(72 60)">
        <rect x="0" y="0" width="160" height="200" rx="56" fill="url(#accent)" opacity="0.16"/>
        <rect x="200" y="20" width="180" height="180" rx="60" fill="url(#accent)" opacity="0.12"/>
        <rect x="30" y="70" width="100" height="18" rx="9" fill="#ffffff" opacity="0.55"/>
        <rect x="30" y="98" width="86" height="18" rx="9" fill="#ffffff" opacity="0.45"/>
        <circle cx="290" cy="110" r="34" fill="#ffffff" opacity="0.55"/>
      </g>
    </g>
  </g>
</svg>
