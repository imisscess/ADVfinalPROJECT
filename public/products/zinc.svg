<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.6" stop-color="#eaf3ff"/>
      <stop offset="1" stop-color="#efe9ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="900" height="700" rx="64" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="120" y="130" width="660" height="440" rx="56" fill="#ffffff"/>
    <rect x="170" y="190" width="220" height="26" rx="13" fill="#e2e8f0"/>
    <rect x="170" y="232" width="340" height="18" rx="9" fill="#e2e8f0"/>
    <g transform="translate(190 290)">
      <rect x="0" y="0" width="520" height="280" rx="56" fill="#f1f5f9"/>
      <g transform="translate(50 60)">
        <rect x="0" y="0" width="220" height="160" rx="50" fill="url(#accent)" opacity="0.18"/>
        <rect x="260" y="0" width="160" height="160" rx="50" fill="url(#accent)" opacity="0.12"/>
        <circle cx="110" cy="80" r="34" fill="#ffffff" opacity="0.55"/>
        <circle cx="340" cy="80" r="26" fill="#ffffff" opacity="0.55"/>
        <circle cx="110" cy="80" r="10" fill="#6d28d9" opacity="0.30"/>
        <circle cx="340" cy="80" r="8" fill="#2563eb" opacity="0.30"/>
      </g>
      <rect x="50" y="232" width="250" height="16" rx="8" fill="#cbd5e1"/>
      <rect x="50" y="258" width="310" height="16" rx="8" fill="#cbd5e1"/>
    </g>
  </g>
