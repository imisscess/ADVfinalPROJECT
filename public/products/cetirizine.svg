      <rect x="32" y="36" width="240" height="22" rx="11" fill="#cbd5e1"/>
      <rect x="32" y="74" width="360" height="18" rx="9" fill="#cbd5e1"/>
      <rect x="32" y="104" width="320" height="18" rx="9" fill="#cbd5e1"/>
      <g transform="translate(380 40)">
        <rect x="0" y="0" width="148" height="148" rx="40" fill="url(#accent)" opacity="0.18"/>
        <circle cx="74" cy="74" r="36" fill="#ffffff" opacity="0.55"/>
        <circle cx="74" cy="74" r="12" fill="#6d28d9" opacity="0.35"/>
