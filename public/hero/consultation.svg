<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.55" stop-color="#eaf3ff"/>
      <stop offset="1" stop-color="#efe9ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <g opacity="0.5">
    <circle cx="1200" cy="210" r="190" fill="#6d28d9" opacity="0.10"/>
    <circle cx="1350" cy="350" r="240" fill="#2563eb" opacity="0.10"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="160" y="180" width="860" height="560" rx="56" fill="#ffffff"/>
    <rect x="220" y="250" width="340" height="28" rx="14" fill="#e2e8f0"/>
    <rect x="220" y="298" width="520" height="18" rx="9" fill="#e2e8f0"/>
    <rect x="220" y="328" width="470" height="18" rx="9" fill="#e2e8f0"/>

    <!-- chat bubbles -->
    <g transform="translate(220 390)">
      <rect x="0" y="0" width="480" height="86" rx="26" fill="#f1f5f9"/>
      <rect x="20" y="22" width="280" height="14" rx="7" fill="#cbd5e1"/>
      <rect x="20" y="46" width="360" height="14" rx="7" fill="#cbd5e1"/>
    </g>
    <g transform="translate(340 500)">
      <rect x="0" y="0" width="520" height="92" rx="26" fill="url(#accent)" opacity="0.13"/>
      <rect x="20" y="26" width="260" height="14" rx="7" fill="#6d28d9" opacity="0.45"/>
      <rect x="20" y="52" width="420" height="14" rx="7" fill="#2563eb" opacity="0.35"/>
    </g>

    <!-- avatar -->
    <g transform="translate(760 305)">
      <circle cx="150" cy="150" r="130" fill="#f1f5f9"/>
      <circle cx="150" cy="140" r="62" fill="#e2e8f0"/>
      <path d="M70 280c22-55 70-82 80-82h0c10 0 58 27 80 82" fill="#e2e8f0"/>
      <rect x="110" y="222" width="80" height="74" rx="18" fill="url(#accent)" opacity="0.18"/>
      <path d="M150 236v46" stroke="#6d28d9" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
      <path d="M127 259h46" stroke="#2563eb" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="1090" y="260" width="360" height="420" rx="52" fill="#ffffff"/>
    <rect x="1140" y="320" width="200" height="22" rx="11" fill="#e2e8f0"/>
    <rect x="1140" y="356" width="260" height="18" rx="9" fill="#e2e8f0"/>
    <rect x="1140" y="386" width="240" height="18" rx="9" fill="#e2e8f0"/>
    <rect x="1140" y="442" width="260" height="60" rx="30" fill="url(#accent)"/>
    <rect x="1165" y="462" width="160" height="18" rx="9" fill="#ffffff" opacity="0.75"/>
    <rect x="1140" y="530" width="220" height="16" rx="8" fill="#e2e8f0"/>
    <rect x="1140" y="558" width="190" height="16" rx="8" fill="#e2e8f0"/>
    <rect x="1140" y="586" width="210" height="16" rx="8" fill="#e2e8f0"/>
  </g>
</svg>
