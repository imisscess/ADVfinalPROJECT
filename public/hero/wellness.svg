<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.55" stop-color="#eaf3ff"/>
      <stop offset="1" stop-color="#efe9ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <g opacity="0.5">
    <circle cx="1240" cy="210" r="170" fill="#2563eb" opacity="0.10"/>
    <circle cx="1120" cy="360" r="240" fill="#6d28d9" opacity="0.10"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="160" y="220" width="640" height="480" rx="56" fill="#ffffff"/>
    <rect x="220" y="290" width="260" height="26" rx="13" fill="#e2e8f0"/>
    <rect x="220" y="332" width="420" height="18" rx="9" fill="#e2e8f0"/>
    <rect x="220" y="362" width="360" height="18" rx="9" fill="#e2e8f0"/>

    <!-- product cards -->
    <g transform="translate(220 420)">
      <rect x="0" y="0" width="180" height="220" rx="28" fill="#f1f5f9"/>
      <rect x="210" y="0" width="180" height="220" rx="28" fill="#f1f5f9"/>
      <rect x="420" y="0" width="180" height="220" rx="28" fill="#f1f5f9"/>
      <rect x="28" y="28" width="124" height="90" rx="22" fill="url(#accent)" opacity="0.18"/>
      <rect x="238" y="28" width="124" height="90" rx="22" fill="url(#accent)" opacity="0.18"/>
      <rect x="448" y="28" width="124" height="90" rx="22" fill="url(#accent)" opacity="0.18"/>
      <rect x="28" y="136" width="110" height="14" rx="7" fill="#cbd5e1"/>
      <rect x="28" y="158" width="90" height="14" rx="7" fill="#cbd5e1"/>
      <rect x="238" y="136" width="110" height="14" rx="7" fill="#cbd5e1"/>
      <rect x="238" y="158" width="90" height="14" rx="7" fill="#cbd5e1"/>
      <rect x="448" y="136" width="110" height="14" rx="7" fill="#cbd5e1"/>
      <rect x="448" y="158" width="90" height="14" rx="7" fill="#cbd5e1"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="860" y="170" width="580" height="560" rx="56" fill="#ffffff"/>

    <!-- big bottle -->
    <g transform="translate(1020 240)">
      <rect x="0" y="50" width="240" height="360" rx="70" fill="#f1f5f9"/>
      <rect x="58" y="0" width="124" height="90" rx="34" fill="#e2e8f0"/>
      <rect x="44" y="130" width="152" height="44" rx="22" fill="url(#accent)" opacity="0.18"/>
      <rect x="54" y="200" width="132" height="16" rx="8" fill="#cbd5e1"/>
      <rect x="54" y="230" width="112" height="16" rx="8" fill="#cbd5e1"/>
      <rect x="54" y="260" width="124" height="16" rx="8" fill="#cbd5e1"/>
    </g>

    <!-- small kit -->
    <g transform="translate(900 520)">
      <rect x="0" y="0" width="240" height="160" rx="40" fill="#f1f5f9"/>
      <rect x="32" y="38" width="120" height="18" rx="9" fill="#cbd5e1"/>
      <rect x="32" y="68" width="160" height="18" rx="9" fill="#cbd5e1"/>
      <rect x="32" y="98" width="140" height="18" rx="9" fill="#cbd5e1"/>
    </g>
  </g>
</svg>
